spring.application.name=notification-service
server.port=8083

# Local Spring app Docker Kafka se connect karegi
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Inventory se alag group: notifications independently events read karengi
spring.kafka.consumer.group-id=notification-service

# Valid committed offset na ho, tab earliest available events se start karo
spring.kafka.consumer.auto-offset-reset=earliest

# Offset progress listener container manage karega
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Key aur JSON message ko String ke roop mein receive karenge
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Listener ke topic names configuration se lenge
app.kafka.topics.order-placed=order-placed
app.kafka.topics.inventory-reserved=inventory-reserved

# Failed event ki retry attempts ke beech 2-second delay
app.kafka.retry-backoff-ms=2000