spring.application.name=api-gateway
server.port=8080

# Orders ki requests order-service ko forward hongi
spring.cloud.gateway.server.webflux.routes[0].id=order-route
spring.cloud.gateway.server.webflux.routes[0].uri=${ORDER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/orders,/api/orders/**

# Inventory ki requests inventory-service ko forward hongi
spring.cloud.gateway.server.webflux.routes[1].id=inventory-route
spring.cloud.gateway.server.webflux.routes[1].uri=${INVENTORY_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/inventory,/api/inventory/**


# Inventory route par CircuitBreaker filter apply karenge
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker

# Is circuit breaker instance ka naam
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=inventoryCircuitBreaker

# Call fail ya circuit OPEN ho toh local fallback endpoint execute hoga
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/inventory


# Last 10 calls ke results track karenge
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.sliding-window-size=10

# Minimum 5 completed calls ke baad failure rate evaluate hogi
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.minimum-number-of-calls=5

# Failure rate 50% ya zyada ho toh circuit OPEN hoga
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.failure-rate-threshold=50

# OPEN hone ke 10 seconds baad trial calls allow kar sakte hain
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.wait-duration-in-open-state=10s

# HALF_OPEN mein 2 trial calls se recovery evaluate karenge
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.permitted-number-of-calls-in-half-open-state=2

# Protected operation ka timeout circuit breaker se alag setting hai
resilience4j.timelimiter.instances.inventoryCircuitBreaker.timeout-duration=3s