spring.application.name=order-service
server.port = 8081

spring.datasource.url=jdbc:mysql://localhost:3306/order_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# IntelliJ se chalne wali service Windows host listener use karegi
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Order ID key ko String se bytes mein convert karega
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Event object ko JSON bytes mein convert karega
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Leader sab current in-sync replicas ki acknowledgement ka wait karega
spring.kafka.producer.acks=all

# Event ka topic configuration se lenge
app.kafka.topics.order-placed=order-placed

# Send result ke liye maximum wait, seconds mein
app.kafka.publish-timeout-seconds=10

# Metadata ya buffer available hone ke liye send() ka maximum blocking time
spring.kafka.producer.properties[max.block.ms]=5000

# Inventory-service ko directly call karne ka address
app.inventory.base-url=${INVENTORY_SERVICE_URL:http://localhost:8082}

# Inventory request ke response ka maximum wait time
app.inventory.request-timeout-seconds=3

# Order-service ka independent consumer group
spring.kafka.consumer.group-id=order-service

# Committed offset nahi ho toh earliest retained event se read karega
spring.kafka.consumer.auto-offset-reset=earliest

# Offset listener processing ke according commit hoga
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# JSON ko String ke form mein receive karenge
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Inventory outcome topics
app.kafka.topics.inventory-reserved=inventory-reserved
app.kafka.topics.inventory-rejected=inventory-rejected