spring.application.name=inventory-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db
spring.datasource.username=inventory_user
spring.datasource.password=${INVENTORY_DB_PASSWORD}

# Local development mein entities ke hisaab se schema update hoga
spring.jpa.hibernate.ddl-auto=update

# Learning ke liye generated SQL console mein dikhegi
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IntelliJ se running service Windows host listener use karegi
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Inventory ke saare instances isi consumer group ka part honge
spring.kafka.consumer.group-id=inventory-service

# Committed offset nahi ho toh earliest retained event se start karo
spring.kafka.consumer.auto-offset-reset=earliest

# Offset commit Spring listener container manage karega
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Key String hogi; incoming JSON ko abhi String ke form mein read karenge
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Reservation result event ko JSON bytes mein publish karenge
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[max.block.ms]=5000

# Topic names aur acknowledgement wait configuration
app.kafka.topics.order-placed=order-placed
app.kafka.topics.inventory-reserved=inventory-reserved
app.kafka.publish-timeout-seconds=10

# Failed listener attempt ke baad retry delay
app.kafka.retry-backoff-ms=2000

