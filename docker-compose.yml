services:
  notification-service:
    image: notification-service:day16
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_started
  api-gateway:
    image: api-gateway:day16
    environment:
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
    depends_on:
      - order-service
      - inventory-service
    ports:
      - "127.0.0.1:8080:8080"
  order-service:
    image: order-service:day15
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/order_db
      SPRING_DATASOURCE_USERNAME: order_user
      DB_PASSWORD: "${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      INVENTORY_SERVICE_URL: http://inventory-service:8082
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      inventory-service:
        condition: service_started
    ports:
      - "127.0.0.1:8081:8081"
  inventory-service:
    image: inventory-service:day16
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inventory_db
      SPRING_DATASOURCE_USERNAME: inventory_user
      INVENTORY_DB_PASSWORD: "${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "127.0.0.1:8082:8082"
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${DAY16_MYSQL_ROOT_PASSWORD:?Set DAY16_MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: inventory_user
      MYSQL_PASSWORD: "${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent" ]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "127.0.0.1:9092:9092"

    environment:
      # Local setup mein ek node broker aur controller dono ka kaam karega
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Windows clients, Docker clients aur controller ke alag listeners
      KAFKA_LISTENERS: "EXTERNAL://:9092,INTERNAL://:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9092,INTERNAL://kafka:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Sirf ek broker hai, isliye internal topics ki replication bhi 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Topics manually create karenge aur data volume mein rakhenge
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
  redis:
      image: redis:7.4
      ports:
        - "127.0.0.1:6379:6379"
      healthcheck:
        test: [ "CMD", "redis-cli", "ping" ]
        interval: 10s
        timeout: 3s
        retries: 5

volumes:
  kafka-data:
  mysql-data: